<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مغامرة الفلزات القلوية والأرضية</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#7fd6ff;--bg2:#d6f3ff;--card:#ffffff;--ink:#2b2350;--sun:#ffd23f;--coral:#ff6b6b;--mint:#2ec4a6;--grape:#8e5bff;--sky:#3aa0ff;--shadow:#2b2350;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a3a8c;--bg2:#4a5bc4;--card:#fff6e0;--ink:#2b2350;}}
:root[data-theme="dark"]{--bg1:#2a3a8c;--bg2:#4a5bc4;--card:#fff6e0;--ink:#2b2350;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Baloo Bhaijaan 2",Tahoma,"Segoe UI",Arial,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg1),var(--bg2));min-height:100vh;overflow-x:hidden}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 40px;position:relative}
.cloud{position:fixed;font-size:56px;opacity:.9;z-index:0;pointer-events:none}
.c1{top:8%;right:6%}.c2{top:30%;left:4%;font-size:42px}.c3{bottom:8%;right:12%;font-size:48px}
.screen{display:none;position:relative;z-index:1}.screen.on{display:block}
.card{background:var(--card);border:4px solid var(--shadow);border-radius:28px;box-shadow:0 8px 0 var(--shadow);padding:18px}
h1{font-size:clamp(28px,7vw,42px);line-height:1.2;margin:6px 0 6px;font-weight:800}
p{font-size:18px;line-height:1.6;margin:6px 0}
.mascot{width:110px;height:110px;margin:0 auto 6px;border-radius:50%;background:var(--sun);border:4px solid var(--shadow);display:grid;place-items:center;font-size:62px;animation:bob 2.4s ease-in-out infinite}
.mascot.small{width:72px;height:72px;font-size:40px;margin:0;flex:none}
@keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}}
.btn{font-family:inherit;font-size:22px;font-weight:800;color:#fff;background:var(--coral);border:4px solid var(--shadow);border-radius:999px;padding:10px 30px;box-shadow:0 6px 0 var(--shadow);cursor:pointer;margin-top:12px;transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--shadow)}
.btn.mint{background:var(--mint)}
.btn:focus-visible,.opt:focus-visible{outline:4px solid var(--grape);outline-offset:3px}
.groups{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 4px}
.g{border:3px solid var(--shadow);border-radius:20px;padding:10px 8px;text-align:center}
.g b{display:block;font-size:17px;margin-bottom:6px}
.g.a{background:#ffe27a}.g.b{background:#b9f0e3}
.chip{display:inline-block;margin:2px;padding:2px 9px;background:#fff;border:2px solid var(--shadow);border-radius:12px;font-weight:800;font-size:16px;direction:ltr}
.hud{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.pill{background:var(--card);border:3px solid var(--shadow);border-radius:999px;padding:2px 14px;font-weight:800;font-size:19px;box-shadow:0 4px 0 var(--shadow);white-space:nowrap}
.bar{flex:1;height:18px;background:#fff;border:3px solid var(--shadow);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--sun));transition:width .4s}
.qrow{display:flex;gap:12px;align-items:center}
.q{font-size:clamp(20px,5vw,26px);font-weight:800;line-height:1.5;margin:0}
.opts{display:grid;gap:12px;margin-top:16px}
.opt{font-family:inherit;font-size:21px;font-weight:700;color:var(--ink);text-align:center;border:4px solid var(--shadow);border-radius:20px;padding:12px;cursor:pointer;box-shadow:0 5px 0 var(--shadow);transition:transform .1s}
.opt:nth-child(1){background:#ffe27a}.opt:nth-child(2){background:#a9e5ff}.opt:nth-child(3){background:#ffc2d1}.opt:nth-child(4){background:#c9f5b8}
.opt:active:not(:disabled){transform:translateY(4px)}
.opt:disabled{cursor:default}
.opt.right{background:var(--mint);color:#fff;animation:pop .5s}
.opt.wrong{background:var(--coral);color:#fff;animation:shake .45s}
.opt.dim{opacity:.55}
@keyframes pop{40%{transform:scale(1.07)}}
@keyframes shake{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.fb{display:none;margin-top:16px;border:3px dashed var(--shadow);border-radius:20px;padding:12px 14px;background:#fffbe8}
.fb.on{display:block;animation:pop .4s}
.fb b{font-size:22px}
.stars{font-size:54px;letter-spacing:6px;margin:6px 0}
.big{font-size:46px;font-weight:800;color:var(--grape)}
.fly{position:fixed;pointer-events:none;z-index:50;font-size:28px;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.plus{position:fixed;z-index:60;font-size:40px;font-weight:800;color:var(--grape);text-shadow:0 3px 0 #fff;pointer-events:none;animation:up 1s ease-out forwards}
@keyframes up{to{transform:translateY(-90px);opacity:0}}
.mute{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:70;font-size:24px;background:var(--card);border:3px solid var(--shadow);border-radius:50%;width:46px;height:46px;cursor:pointer}
.center{text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="cloud c1">☁️</div><div class="cloud c2">☁️</div><div class="cloud c3">☁️</div>
<button class="mute" id="mute" aria-label="تشغيل أو إيقاف الصوت">🔊</button>
<div class="wrap">

<section class="screen on center" id="s-start">
  <div class="card">
    <div class="mascot">🧑‍🔬</div>
    <h1>مغامرة الفلزات!</h1>
    <p>أنا الدكتور ذرّوب. هيا نتعرف على الفلزات القلوية والفلزات الأرضية القلوية ونجمع النجوم!</p>
    <div class="groups">
      <div class="g a"><b>⚡ القلوية — المجموعة 1</b><span class="chip">Li</span><span class="chip">Na</span><span class="chip">K</span><span class="chip">Rb</span><span class="chip">Cs</span><span class="chip">Fr</span></div>
      <div class="g b"><b>🦴 الأرضية القلوية — المجموعة 2</b><span class="chip">Be</span><span class="chip">Mg</span><span class="chip">Ca</span><span class="chip">Sr</span><span class="chip">Ba</span><span class="chip">Ra</span></div>
    </div>
    <button class="btn" id="go">ابدأ اللعب 🚀</button>
  </div>
</section>

<section class="screen" id="s-game">
  <div class="hud">
    <div class="pill">⭐ <span id="score">0</span></div>
    <div class="bar"><i id="prog"></i></div>
    <div class="pill" id="streak">🔥 0</div>
  </div>
  <div class="card">
    <div class="qrow"><div class="mascot small" id="face">🤔</div><p class="q" id="q"></p></div>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb" aria-live="polite"><b id="fbt"></b><p id="fbx"></p></div>
    <div class="center"><button class="btn mint" id="next" style="display:none">السؤال التالي ⬅️</button></div>
  </div>
</section>

<section class="screen center" id="s-end">
  <div class="card">
    <div class="mascot" id="endface">🥳</div>
    <h1 id="endt"></h1>
    <div class="stars" id="stars"></div>
    <div class="big"><span id="final">0</span> نقطة</div>
    <p id="endx"></p>
    <button class="btn" id="again">العب مرة أخرى 🔄</button>
  </div>
</section>

</div>
<script>
const QS=[
{q:"أي عنصر من هذه العناصر هو فلز قلوي؟",o:["الصوديوم Na","المغنيسيوم Mg","الكالسيوم Ca","الألومنيوم Al"],a:0,e:"الصوديوم من المجموعة 1، أي من الفلزات القلوية، وهو موجود في ملح الطعام."},
{q:"الفلزات القلوية تقع في أي مجموعة من الجدول الدوري؟",o:["المجموعة 1","المجموعة 2","المجموعة 17","المجموعة 18"],a:0,e:"الفلزات القلوية هي عناصر المجموعة 1 (ما عدا الهيدروجين)."},
{q:"كم إلكتروناً في المستوى الخارجي للفلزات القلوية؟",o:["1","2","3","7"],a:0,e:"لكل فلز قلوي إلكترون تكافؤ واحد، ولذلك يفقده بسهولة ويصبح أيوناً شحنته +1."},
{q:"كم إلكترون تكافؤ للفلزات الأرضية القلوية؟",o:["1","2","6","8"],a:1,e:"الأرضية القلوية في المجموعة 2 ولها إلكترونان خارجيان، وتكوّن أيونات شحنتها +2."},
{q:"أي عنصر من هذه فلز أرضي قلوي؟",o:["البوتاسيوم K","الكالسيوم Ca","الليثيوم Li","السيزيوم Cs"],a:1,e:"الكالسيوم من المجموعة 2، وهو من أشهر الفلزات الأرضية القلوية."},
{q:"لماذا نحفظ الصوديوم والبوتاسيوم تحت الزيت؟",o:["لأنهما يحبان الزيت","لأنهما شديدا النشاط مع الماء والهواء","لكي يصبحا لامعين","لأنهما ثقيلان جداً"],a:1,e:"الفلزات القلوية نشطة جداً، فنبعدها عن الماء والهواء بحفظها تحت الزيت."},
{q:"ما الغاز الذي ينتج عندما يتفاعل الصوديوم مع الماء؟",o:["الأكسجين","ثاني أكسيد الكربون","الهيدروجين","النيتروجين"],a:2,e:"يتفاعل الصوديوم مع الماء فينتج غاز الهيدروجين وهيدروكسيد الصوديوم، والتفاعل سريع وقوي!"},
{q:"أيهما أنشط: البوتاسيوم K أم الليثيوم Li؟",o:["الليثيوم","البوتاسيوم","متساويان","لا يتفاعل أي منهما"],a:1,e:"كلما نزلنا في المجموعة 1 زاد النشاط، لأن الإلكترون الخارجي يصبح أسهل في الفقد."},
{q:"أي فلز أرضي قلوي يحترق بلهب أبيض ساطع كالفلاش؟",o:["المغنيسيوم Mg","الصوديوم Na","الحديد Fe","الذهب Au"],a:0,e:"المغنيسيوم يحترق بضوء أبيض مبهر، ويُستخدم في الألعاب النارية 🎆."},
{q:"أي فلز أرضي قلوي مهم لبناء عظامنا وأسناننا؟",o:["البريليوم","الكالسيوم","الراديوم","الباريوم"],a:1,e:"الكالسيوم موجود في الحليب والجبن، ويجعل عظامنا وأسناننا قوية 🦷."}
];
const $=id=>document.getElementById(id);
let i,score,streak,right,done,muted=false,ac;
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}
function beep(notes){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();let t=ac.currentTime;notes.forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d);t+=d*.8})}catch(e){}}
function confetti(x,y,n,set){for(let k=0;k<n;k++){const s=document.createElement('span');s.className='fly';s.textContent=set[k%set.length];s.style.left=x+'px';s.style.top=y+'px';const a=Math.random()*Math.PI*2,r=80+Math.random()*140;s.style.setProperty('--x',Math.cos(a)*r+'px');s.style.setProperty('--y',Math.sin(a)*r-60+'px');s.style.setProperty('--r',(Math.random()*540-270)+'deg');document.body.appendChild(s);setTimeout(()=>s.remove(),1200)}}
function plus(x,y,t){const p=document.createElement('div');p.className='plus';p.textContent=t;p.style.left=x-30+'px';p.style.top=y-30+'px';document.body.appendChild(p);setTimeout(()=>p.remove(),1000)}
function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function start(){i=0;score=0;streak=0;right=0;$('score').textContent=0;$('streak').textContent='🔥 0';show('s-game');load()}
function load(){
  done=false;const Q=QS[i];
  $('q').textContent=Q.q;$('face').textContent='🤔';
  $('prog').style.width=(i/QS.length*100)+'%';
  $('fb').classList.remove('on');$('next').style.display='none';
  const box=$('opts');box.innerHTML='';
  shuffle(Q.o.map((t,k)=>({t,ok:k===Q.a}))).forEach(x=>{
    const b=document.createElement('button');b.className='opt';b.textContent=x.t;b.dataset.ok=x.ok?1:0;
    b.onclick=e=>pick(b,e);box.appendChild(b)});
}
function pick(b,e){
  if(done)return;done=true;
  const ok=b.dataset.ok==='1',r=b.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  document.querySelectorAll('.opt').forEach(o=>{o.disabled=true;if(o.dataset.ok==='1')o.classList.add('right');else if(o!==b)o.classList.add('dim')});
  const msgs=["أحسنت يا بطل! 🎉","رائع جداً! 🌟","ممتاز! أنت عبقري! 🧠","إجابة صحيحة! 👏","يا سلام عليك! 🥳"];
  if(ok){
    streak++;right++;const gain=10+5*Math.min(streak-1,3);score+=gain;
    $('score').textContent=score;$('streak').textContent='🔥 '+streak;$('face').textContent='🥳';
    $('fbt').textContent=msgs[Math.floor(Math.random()*msgs.length)]+(streak>=2?` (${streak} متتالية!)`:'');
    plus(cx,cy,'+'+gain);confetti(cx,cy,18,['⭐','✨','🎉','🎈','💥']);
    beep([[523,.12],[659,.12],[784,.2]]);
  }else{
    b.classList.add('wrong');streak=0;$('streak').textContent='🔥 0';$('face').textContent='😅';
    $('fbt').textContent="لا بأس، حاول مرة أخرى في السؤال القادم! 💪";
    beep([[330,.18],[247,.25]]);
  }
  $('fbx').textContent='💡 '+QS[i].e;$('fb').classList.add('on');
  $('next').textContent=i===QS.length-1?'شاهد نتيجتك 🏆':'السؤال التالي ⬅️';$('next').style.display='inline-block';$('next').focus({preventScroll:false});
}
function end(){
  $('prog').style.width='100%';
  const p=right/QS.length,n=p>=.8?3:p>=.5?2:1;
  $('stars').textContent='⭐'.repeat(n)+'☆'.repeat(3-n);
  $('final').textContent=score;
  $('endt').textContent=p>=.8?'أنت خبير الفلزات! 🏆':p>=.5?'عمل رائع! 👏':'بداية جميلة! 🌱';
  $('endx').textContent=`أجبت إجابة صحيحة عن ${right} من ${QS.length} أسئلة.`+(p<.8?' جرّب مرة أخرى لتحصل على 3 نجوم!':' ممتاز، لقد أتقنت الدرس!');
  $('endface').textContent=p>=.8?'🥳':p>=.5?'😄':'🤗';
  show('s-end');
  if(p>=.5){confetti(innerWidth/2,innerHeight/3,36,['⭐','🎉','✨','🎈','🏆']);beep([[523,.12],[659,.12],[784,.12],[1047,.3]])}
}
$('go').onclick=start;$('again').onclick=start;
$('next').onclick=()=>{i++;i<QS.length?load():end()};
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊'};
</script>
</body>
</html>
